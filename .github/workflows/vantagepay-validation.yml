name: VantagePay validation
on:
  push:
    branches:
      - vantagepay-integration-plan
      - vantagepay-ledger-adjustment-hardening
  pull_request:
    branches:
      - main
      - vantagepay-premium-dashboard
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
