name: AlpsCoinChain X Auto-Posting

on:
  schedule:
    # Three posts daily, UTC. GitHub Actions may start scheduled jobs a little late.
    - cron: "0 8,13,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpscoinchain-x-auto-posting
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish one scheduled post
        env:
          X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
        run: node x-bot/post.js
