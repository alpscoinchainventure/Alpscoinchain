name: VantagePay regression tests

on:
  push:
    branches:
      - vantagepay-premium-dashboard
  pull_request:
    branches:
      - vantagepay-release-hardening

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression suite
        run: npm test
