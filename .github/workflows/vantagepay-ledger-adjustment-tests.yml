name: VantagePay balance adjustment migration checks

on:
  push:
    branches:
      - vantagepay-ledger-adjustment-hardening
  pull_request:
    branches:
      - vantagepay-premium-dashboard

jobs:
  migration-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository and migration safety tests
        run: npm test
