<script>
const SUPABASE_URL =
    'https://uevofmlzpwrdidjnwxfd.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_OLqZsWFBHY8CaTkko0-FcA_26y2jhJB';

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);

async function getValidSession() {
    // First check the existing session.
    let {
        data: { session },
        error
    } = await supabaseClient.auth.getSession();

    if (error) {
        console.error('Session check error:', error);
        return null;
    }

    if (session) {
        return session;
    }

    // Give Supabase a moment to restore the session.
    await new Promise(resolve => setTimeout(resolve, 1000));

    const secondCheck =
        await supabaseClient.auth.getSession();

    if (secondCheck.error) {
        console.error(
            'Second session check error:',
            secondCheck.error
        );
        return null;
    }

    return secondCheck.data.session;
}

async function loadDashboard() {

    const loadingScreen =
        document.getElementById('loadingScreen');

    const dashboard =
        document.getElementById('dashboard');

    const userEmail =
        document.getElementById('userEmail');

    const accountEmail =
        document.getElementById('accountEmail');

    const userId =
        document.getElementById('userId');

    const session = await getValidSession();

    if (!session) {
        window.location.replace('login.html');
        return;
    }

    const user = session.user;

    userEmail.textContent = user.email || '';
    accountEmail.textContent = user.email || '';
    userId.textContent = user.id;

    loadingScreen.style.display = 'none';
    dashboard.style.display = 'block';
}

function showTradeMessage(asset) {

    const message =
        document.getElementById('tradeMessage');

    message.textContent =
        `${asset} trading is available from your client account.`;

    message.style.display = 'block';
}

document
    .getElementById('logoutButton')
    .addEventListener('click', async () => {

        await supabaseClient.auth.signOut();

        window.location.replace('login.html');
    });

document
    .getElementById('supportForm')
    .addEventListener('submit', async (event) => {

        event.preventDefault();

        const subject =
            document.getElementById('supportSubject').value.trim();

        const messageText =
            document.getElementById('supportText').value.trim();

        const message =
            document.getElementById('supportMessage');

        const session = await getValidSession();

        if (!session) {
            window.location.replace('login.html');
            return;
        }

        if (!subject || !messageText) {
            return;
        }

        message.textContent =
            'Your support request has been prepared for submission.';

        message.style.display = 'block';

        document.getElementById('supportForm').reset();
    });

loadDashboard();
</script>
