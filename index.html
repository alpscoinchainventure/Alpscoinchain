<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login | AlpsCoinChain</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #0a0e27;
            color: #f8fafc;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
        }

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand h1 {
            color: #6366f1;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .brand p {
            color: #94a3b8;
        }

        .login-card {
            background: #0f172a;
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #111827;
            color: #94a3b8;
            cursor: pointer;
            font-weight: 600;
        }

        .tab.active {
            background: #6366f1;
            border-color: #6366f1;
            color: white;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #6366f1;
        }

        .password-row {
            position: relative;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
        }

        .submit-btn:hover {
            background: #4f46e5;
        }

        .forgot {
            display: block;
            text-align: right;
            margin: 10px 0 20px;
            color: #818cf8;
            font-size: 14px;
            cursor: pointer;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
        }

        .message.error {
            display: block;
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.35);
            color: #fca5a5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: white;
        }

        .signup-note {
            margin-top: 18px;
            color: #64748b;
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="brand">
        <h1>AlpsCoinChain</h1>
        <p>Client Account Access</p>
    </div>

    <div class="login-card">

        <div class="tabs">
            <button type="button" class="tab active" id="loginTab">
                Sign In
            </button>

            <button type="button" class="tab" id="signupTab">
                Create Account
            </button>
        </div>

        <div id="message" class="message"></div>

        <form id="authForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                    autocomplete="current-password"
                >
            </div>

            <div id="confirmPasswordGroup" class="form-group" style="display:none;">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <span id="forgotPassword" class="forgot">
                Forgot your password?
            </span>

            <button type="submit" class="submit-btn" id="submitButton">
                Sign In
            </button>

        </form>

        <div class="signup-note">
            By creating an account, you agree to use this platform responsibly.
        </div>

        <a href="index.html" class="back-link">
            ← Back to AlpsCoinChain
        </a>

    </div>
</div>

<script>
    const SUPABASE_URL = 'https://uevofmlzpwrdidjnwxfd.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
        'sb_publishable_OLqZsWFBHY8CaTkko0-FcA_26y2jhJB';

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    let mode = 'login';

    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const authForm = document.getElementById('authForm');
    const confirmPasswordGroup =
        document.getElementById('confirmPasswordGroup');
    const confirmPassword =
        document.getElementById('confirmPassword');
    const forgotPassword =
        document.getElementById('forgotPassword');
    const submitButton =
        document.getElementById('submitButton');
    const message =
        document.getElementById('message');

    function showMessage(text, type) {
        message.textContent = text;
        message.className = 'message ' + type;
    }

    function clearMessage() {
        message.textContent = '';
        message.className = 'message';
    }

    function setMode(newMode) {
        mode = newMode;
        clearMessage();

        if (mode === 'login') {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');

            confirmPasswordGroup.style.display = 'none';
            confirmPassword.required = false;

            forgotPassword.style.display = 'block';
            submitButton.textContent = 'Sign In';
        } else {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');

            confirmPasswordGroup.style.display = 'block';
            confirmPassword.required = true;

            forgotPassword.style.display = 'none';
            submitButton.textContent = 'Create Account';
        }
    }

    loginTab.addEventListener('click', () => {
        setMode('login');
    });

    signupTab.addEventListener('click', () => {
        setMode('signup');
    });

    authForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        clearMessage();

        const email =
            document.getElementById('email').value.trim();

        const password =
            document.getElementById('password').value;

        submitButton.disabled = true;

        try {
            if (mode === 'signup') {

                if (password !== confirmPassword.value) {
                    showMessage(
                        'The passwords do not match.',
                        'error'
                    );
                    return;
                }

                const { data, error } =
                    await supabaseClient.auth.signUp({
                        email,
                        password
                    });

                if (error) {
                    throw error;
                }

                if (data.session) {
                    window.location.href =
                        'client-dashboard.html';
                    return;
                }

                showMessage(
                    'Account created. Please check your email to confirm your account before signing in.',
                    'success'
                );

            } else {

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });

                if (error) {
                    throw error;
                }

                if (data.session) {
                    window.location.href =
                        'client-dashboard.html';
                }
            }

        } catch (error) {
            showMessage(
                error.message || 'Unable to complete the request.',
                'error'
            );
        } finally {
            submitButton.disabled = false;
        }
    });

    forgotPassword.addEventListener('click', async () => {

        const email =
            document.getElementById('email').value.trim();

        if (!email) {
            showMessage(
                'Enter your email address first, then select Forgot your password.',
                'error'
            );
            return;
        }

        try {
            const redirectUrl =
                window.location.origin + '/reset-password.html';

            const { error } =
                await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo: redirectUrl
                    }
                );

            if (error) {
                throw error;
            }

            showMessage(
                'Password reset instructions have been sent to your email.',
                'success'
            );

        } catch (error) {
            showMessage(
                error.message || 'Unable to send the password reset email.',
                'error'
            );
        }
    });
</script>

</body>
</html>
