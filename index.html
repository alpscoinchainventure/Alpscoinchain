<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login | AlpsCoinChain</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root{color-scheme:dark;--ink:#edf5ff;--muted:#9eb1cb;--line:rgba(154,185,226,.2);--blue:#2f83ff;--deep:#07111f}
        *{box-sizing:border-box;margin:0;padding:0}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 15% 12%,rgba(35,119,212,.25),transparent 36%),radial-gradient(ellipse at 88% 85%,rgba(25,176,150,.16),transparent 32%),linear-gradient(145deg,#050b14,#0a1a2e 54%,#07101c);color:var(--ink)}
        .login-container{width:100%;max-width:470px}
        .brand{text-align:center;margin-bottom:26px}.brand-mark{display:block;width:74px;height:74px;margin:0 auto 14px;filter:drop-shadow(0 8px 20px rgba(47,131,255,.22))}
        .brand h1{color:#f3f8ff;font-size:clamp(28px,5vw,36px);letter-spacing:-.055em;margin-bottom:8px;font-weight:800;text-shadow:0 0 34px rgba(47,131,255,.25)}
        .brand p{color:#a8c1e2;letter-spacing:.08em;text-transform:uppercase;font-size:11px;font-weight:700}
        .login-card{background:linear-gradient(145deg,rgba(18,35,58,.94),rgba(8,22,39,.96));border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,32px);box-shadow:0 28px 80px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.045);backdrop-filter:blur(18px)}
        .tabs{display:flex;gap:8px;margin-bottom:24px;padding:5px;border:1px solid rgba(154,185,226,.12);background:rgba(3,12,23,.45);border-radius:13px}
        .tab{flex:1;padding:12px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;font-family:inherit;transition:all .18s ease}
        .tab.active{background:linear-gradient(135deg,#2f83ff,#1b5bc3);border-color:rgba(133,186,255,.4);color:#fff;box-shadow:0 6px 18px rgba(30,105,218,.24)}
        .form-group{margin-bottom:18px}label{display:block;margin-bottom:8px;color:#cbdcf0;font-size:13px;font-weight:650}
        input{width:100%;padding:14px;border-radius:11px;border:1px solid rgba(154,185,226,.2);background:rgba(3,12,23,.65);color:white;outline:none;font:inherit;transition:border-color .18s,box-shadow .18s}
        input:focus{border-color:#438fff;box-shadow:0 0 0 3px rgba(47,131,255,.14)}
        .password-row{position:relative}
        .submit-btn{width:100%;padding:14px;border:1px solid rgba(144,194,255,.3);border-radius:11px;background:linear-gradient(135deg,#2f83ff,#1c5ec9);color:white;font-size:15px;font-weight:750;cursor:pointer;margin-top:4px;font-family:inherit;box-shadow:0 10px 24px rgba(25,95,202,.2);transition:filter .18s,transform .18s}
        .submit-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.submit-btn:disabled{opacity:.6;cursor:wait;transform:none}
        .forgot{display:block;text-align:right;margin:10px 0 20px;color:#7fb2ff;font-size:13px;cursor:pointer}
        .message{display:none;padding:12px 13px;border-radius:10px;margin-bottom:18px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
        .message.success{display:block;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.28);color:#8de7c0}
        .message.error{display:block;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.28);color:#ffb0b0}
        .back-link{display:block;text-align:center;margin-top:22px;color:#a9bdd6;text-decoration:none;font-size:13px}.back-link:hover{color:white}
        .signup-note{margin-top:18px;color:#8298b5;text-align:center;font-size:12px;line-height:1.6}
        @media(max-width:480px){body{padding:16px}.login-card{border-radius:18px}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
    </style>
</head>

<body>

<div class="login-container">

    <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="AlpsCoinChain mountain and coin logo" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="accLogoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#72e5c0"/><stop offset="1" stop-color="#3287ff"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="18" fill="#0b1b30" stroke="#5f9bdb" stroke-opacity=".55"/><circle cx="43" cy="22" r="11" fill="none" stroke="url(#accLogoGrad)" stroke-width="2.5"/><path d="M10 45 24 25l8 11 6-8 15 17H10Z" fill="url(#accLogoGrad)" fill-opacity=".2" stroke="url(#accLogoGrad)" stroke-width="2.5" stroke-linejoin="round"/><path d="M18 45 28 32l5 7 4-5 10 11" fill="none" stroke="#d9f8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h1>AlpsCoinChain</h1>
        <p>Client Account Access</p>
    </div>

    <div class="login-card">

        <div class="tabs">
            <button type="button" class="tab active" id="loginTab">
                Sign In
            </button>

            <button type="button" class="tab" id="signupTab">
                Create Account
            </button>
        </div>

        <div id="message" class="message"></div>

        <form id="authForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                    autocomplete="current-password"
                >
            </div>

            <div id="confirmPasswordGroup" class="form-group" style="display:none;">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    autocomplete="new-password"
                >
            </div>

            <span id="forgotPassword" class="forgot">
                Forgot your password?
            </span>

            <button type="submit" class="submit-btn" id="submitButton">
                Sign In
            </button>

        </form>

        <div class="signup-note">
            By creating an account, you agree to use this platform responsibly.
        </div>

        <a href="index.html" class="back-link">
            ← Back to AlpsCoinChain
        </a>

    </div>
</div>

<script>
    const SUPABASE_URL = 'https://uevofmlzpwrdidjnwxfd.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
        'sb_publishable_OLqZsWFBHY8CaTkko0-FcA_26y2jhJB';

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    let mode = 'login';

    const loginTab = document.getElementById('loginTab');
    const signupTab = document.getElementById('signupTab');
    const authForm = document.getElementById('authForm');
    const confirmPasswordGroup =
        document.getElementById('confirmPasswordGroup');
    const confirmPassword =
        document.getElementById('confirmPassword');
    const forgotPassword =
        document.getElementById('forgotPassword');
    const submitButton =
        document.getElementById('submitButton');
    const message =
        document.getElementById('message');

    function showMessage(text, type) {
        message.textContent = text;
        message.className = 'message ' + type;
    }

    function clearMessage() {
        message.textContent = '';
        message.className = 'message';
    }

    function setMode(newMode) {
        mode = newMode;
        clearMessage();

        if (mode === 'login') {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');

            confirmPasswordGroup.style.display = 'none';
            confirmPassword.required = false;

            forgotPassword.style.display = 'block';
            submitButton.textContent = 'Sign In';
        } else {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');

            confirmPasswordGroup.style.display = 'block';
            confirmPassword.required = true;

            forgotPassword.style.display = 'none';
            submitButton.textContent = 'Create Account';
        }
    }

    loginTab.addEventListener('click', () => {
        setMode('login');
    });

    signupTab.addEventListener('click', () => {
        setMode('signup');
    });

    authForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        clearMessage();

        const email =
            document.getElementById('email').value.trim();

        const password =
            document.getElementById('password').value;

        submitButton.disabled = true;

        try {
            if (mode === 'signup') {

                if (password !== confirmPassword.value) {
                    showMessage(
                        'The passwords do not match.',
                        'error'
                    );
                    return;
                }

                const { data, error } =
                    await supabaseClient.auth.signUp({
                        email,
                        password
                    });

                if (error) {
                    throw error;
                }

                if (data.session) {
                    window.location.href =
                        'client-dashboard.html';
                    return;
                }

                showMessage(
                    'Account created. Please check your email to confirm your account before signing in.',
                    'success'
                );

            } else {

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });

                if (error) {
                    throw error;
                }

                if (data.session) {
                    window.location.href =
                        'client-dashboard.html';
                }
            }

        } catch (error) {
            showMessage(
                error.message || 'Unable to complete the request.',
                'error'
            );
        } finally {
            submitButton.disabled = false;
        }
    });

    forgotPassword.addEventListener('click', async () => {

        const email =
            document.getElementById('email').value.trim();

        if (!email) {
            showMessage(
                'Enter your email address first, then select Forgot your password.',
                'error'
            );
            return;
        }

        try {
            const redirectUrl =
                window.location.origin + '/reset-password.html';

            const { error } =
                await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo: redirectUrl
                    }
                );

            if (error) {
                throw error;
            }

            showMessage(
                'Password reset instructions have been sent to your email.',
                'success'
            );

        } catch (error) {
            showMessage(
                error.message || 'Unable to send the password reset email.',
                'error'
            );
        }
    });
</script>

</body>
</html>
