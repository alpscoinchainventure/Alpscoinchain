<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Login | AlpsCoinChain</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    :root{color-scheme:dark;--ink:#edf5ff;--muted:#9eb1cb;--line:rgba(154,185,226,.2);--blue:#2f83ff}
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 15% 12%,rgba(35,119,212,.25),transparent 36%),radial-gradient(ellipse at 88% 85%,rgba(25,176,150,.16),transparent 32%),linear-gradient(145deg,#050b14,#0a1a2e 54%,#07101c);color:var(--ink)}
    .login-container{width:100%;max-width:470px}.brand{text-align:center;margin-bottom:26px}.brand h1{color:#f3f8ff;font-size:clamp(28px,5vw,36px);letter-spacing:-.055em;margin-bottom:8px;font-weight:800;text-shadow:0 0 34px rgba(47,131,255,.25)}.brand p{color:#a8c1e2;letter-spacing:.08em;text-transform:uppercase;font-size:11px;font-weight:700}
    .login-card{background:linear-gradient(145deg,rgba(18,35,58,.94),rgba(8,22,39,.96));border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,32px);box-shadow:0 28px 80px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.045);backdrop-filter:blur(18px)}
    .tabs{display:flex;gap:8px;margin-bottom:24px;padding:5px;border:1px solid rgba(154,185,226,.12);background:rgba(3,12,23,.45);border-radius:13px}.tab{flex:1;padding:12px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;font-family:inherit;transition:all .18s ease}.tab.active{background:linear-gradient(135deg,#2f83ff,#1b5bc3);border-color:rgba(133,186,255,.4);color:#fff;box-shadow:0 6px 18px rgba(30,105,218,.24)}
    .form-group{margin-bottom:18px}label{display:block;margin-bottom:8px;color:#cbdcf0;font-size:13px;font-weight:650}.password-row{position:relative}input{width:100%;padding:14px;border-radius:11px;border:1px solid rgba(154,185,226,.2);background:rgba(3,12,23,.65);color:white;outline:none;font:inherit;transition:border-color .18s,box-shadow .18s}input:focus{border-color:#438fff;box-shadow:0 0 0 3px rgba(47,131,255,.14)}
    .submit-btn{width:100%;padding:14px;border:1px solid rgba(144,194,255,.3);border-radius:11px;background:linear-gradient(135deg,#2f83ff,#1c5ec9);color:white;font-size:15px;font-weight:750;cursor:pointer;margin-top:4px;font-family:inherit;box-shadow:0 10px 24px rgba(25,95,202,.2);transition:filter .18s,transform .18s}.submit-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.submit-btn:disabled{opacity:.6;cursor:wait;transform:none}
    .forgot{display:block;text-align:right;margin:10px 0 20px;color:#7fb2ff;font-size:13px;cursor:pointer}.message{display:none;padding:12px 13px;border-radius:10px;margin-bottom:18px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}.message.success{display:block;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.28);color:#8de7c0}.message.error{display:block;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.28);color:#ffb0b0}
    .back-link{display:block;text-align:center;margin-top:22px;color:#a9bdd6;text-decoration:none;font-size:13px}.back-link:hover{color:white}.signup-note{margin-top:18px;color:#8298b5;text-align:center;font-size:12px;line-height:1.6}
    @media(max-width:480px){body{padding:16px}.login-card{border-radius:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style></head><body>
  <main class="login-card">
    <h1>AlpsCoinChain</h1>
    <p class="subtitle">Sign in to your account</p><form id="loginForm">
  <label for="email">Email Address</label>
  <input
    id="email"
    type="email"
    placeholder="Enter your email"
    autocomplete="username"
    required
  >

  <label for="password">Password</label>

  <div class="password-field">
    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button
      type="button"
      id="togglePassword"
      class="password-toggle"
      aria-controls="password"
      aria-pressed="false"
    >Show</button>
  </div>

  <div
    id="message"
    class="message"
    role="status"
    aria-live="polite"
  ></div>

  <button type="submit" id="loginButton">Sign In</button>
</form>

<button type="button" class="secondary" id="signupButton">
  Create Account
</button>

<div class="links">
  <button type="button" id="forgotButton">
    Forgot your password?
  </button>
</div>

<a class="back-link" href="/">← Back to AlpsCoinChain</a>

  </main>  <script>
    'use strict';

    const SUPABASE_URL =
      'https://uevofmlzpwrdidjnwxfd.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_OLqZsWFBHY8CaTkko0-FcA_26y2jhJB';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const signupButton = document.getElementById('signupButton');
    const forgotButton = document.getElementById('forgotButton');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const message = document.getElementById('message');

    togglePassword.addEventListener('click', function () {
      const showPassword = passwordInput.type === 'password';

      passwordInput.type = showPassword ? 'text' : 'password';
      togglePassword.textContent = showPassword ? 'Hide' : 'Show';
      togglePassword.setAttribute(
        'aria-pressed',
        String(showPassword)
      );

      passwordInput.focus();
    });

    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      message.textContent = '';
      loginButton.disabled = true;
      loginButton.textContent = 'Signing in...';

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          message.textContent = error.message;
          return;
        }

        if (!data.session || !data.user) {
          message.textContent =
            'Login succeeded, but no session was created.';
          return;
        }

        message.textContent = 'Verifying account permissions...';

        const { data: profile, error: profileError } =
          await supabaseClient
            .from('profiles')
            .select('role, account_status')
            .eq('id', data.user.id)
            .maybeSingle();

        if (profileError) {
          await supabaseClient.auth.signOut();

          message.textContent =
            'Unable to verify your account role. Please try again or contact support.';
          console.error(
            'Account role verification failed:',
            profileError.message
          );
          return;
        }

        if (!profile) {
          await supabaseClient.auth.signOut();

          message.textContent =
            'Your account profile could not be found. Please contact support.';
          return;
        }

        if (profile.account_status !== 'active') {
          await supabaseClient.auth.signOut();

          message.textContent =
            'Your account is not active. Please contact support.';
          return;
        }

        if (profile.role === 'admin') {
          window.location.replace('/admin-dashboard.html');
          return;
        }

        if (profile.role === 'client') {
          window.location.replace('/client-dashboard.html');
          return;
        }

        await supabaseClient.auth.signOut();

        message.textContent =
          'Your account has an unrecognized role. Please contact support.';

      } catch (error) {
        console.error('Sign-in error:', error);

        message.textContent =
          'Unable to complete sign-in. Please try again.';
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = 'Sign In';
      }
    });

    signupButton.addEventListener('click', function () {
      window.location.href = '/signup.html';
    });

    forgotButton.addEventListener('click', async function () {
      const email = emailInput.value.trim();

      if (!email) {
        message.textContent = 'Enter your email address first.';
        emailInput.focus();
        return;
      }

      message.textContent = 'Sending password reset email...';
      forgotButton.disabled = true;

      try {
        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo:
              window.location.origin + '/reset-password.html'
          });

        if (error) {
          message.textContent =
            'Unable to request a reset email. Please try again.';
          console.error('Password reset request failed:', error.message);
          return;
        }

        message.textContent =
          'If the account is eligible, a password-reset email will be sent. Check your inbox.';

      } catch (error) {
        console.error('Password reset error:', error);

        message.textContent =
          'Unable to request a reset email right now. Please try again.';
      } finally {
        forgotButton.disabled = false;
      }
    });
  </script></body>
</html>
