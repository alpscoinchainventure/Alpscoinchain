<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AlpsCoinChain</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;background:#0a0e27;color:#f8fafc}
        .card{width:100%;max-width:430px;background:#0f172a;border:1px solid rgba(99,102,241,.25);border-radius:16px;padding:30px}
        h1{text-align:center;margin-bottom:8px}
        .subtitle{text-align:center;color:#94a3b8;margin-bottom:25px;line-height:1.5}
        label{display:block;margin-bottom:7px;color:#cbd5e1;font-size:14px}
        input{width:100%;padding:13px;margin-bottom:16px;border-radius:8px;border:1px solid #334155;background:#111827;color:white;outline:none}
        input:focus{border-color:#6366f1}
        button{width:100%;padding:13px;border:none;border-radius:8px;background:#6366f1;color:white;font-weight:700;cursor:pointer}
        button:hover{background:#4f46e5}
        button:disabled{opacity:.6;cursor:not-allowed}
        .message{min-height:22px;margin:15px 0;text-align:center;color:#fbbf24;font-size:14px;line-height:1.5}
        .back{display:block;margin-top:18px;text-align:center;color:#818cf8;text-decoration:none}
    </style>
</head>
<body>

<div class="card">
    <h1>Reset Password</h1>
    <p class="subtitle">Enter a new password for your AlpsCoinChain account.</p>

    <form id="resetForm">
        <label for="password">New Password</label>
        <input id="password" type="password" placeholder="Enter your new password" minlength="6" required>

        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password" placeholder="Confirm your new password" minlength="6" required>

        <div id="message" class="message"></div>

        <button type="submit" id="resetButton">Update Password</button>
    </form>

    <a class="back" href="login.html">Back to Sign In</a>
</div>

<script>
const SUPABASE_URL="https://uevofmlzpwrdidjnwxfd.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_OLqZsWFBHY8CaTkko0-FcA_26y2jhJB";

const supabaseClient=window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);

const form=document.getElementById("resetForm");
const button=document.getElementById("resetButton");
const message=document.getElementById("message");

supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==="PASSWORD_RECOVERY" && session){
        message.textContent="You can now choose your new password.";
    }
});

form.addEventListener("submit",async(event)=>{
    event.preventDefault();

    const password=document.getElementById("password").value;
    const confirmPassword=document.getElementById("confirmPassword").value;

    if(password.length<6){
        message.textContent="Password must be at least 6 characters.";
        return;
    }

    if(password!==confirmPassword){
        message.textContent="The passwords do not match.";
        return;
    }

    const {
        data:{session},
        error:sessionError
    }=await supabaseClient.auth.getSession();

    if(sessionError || !session){
        message.textContent="Please open the password reset link from your email again.";
        return;
    }

    button.disabled=true;
    button.textContent="Updating password...";

    const {error}=await supabaseClient.auth.updateUser({
        password:password
    });

    if(error){
        message.textContent=error.message;
        button.disabled=false;
        button.textContent="Update Password";
        return;
    }

    message.textContent="Password updated successfully. Returning to Sign In...";

    setTimeout(()=>{
        window.location.replace("login.html");
    },1500);
});
</script>

</body>
</html>
